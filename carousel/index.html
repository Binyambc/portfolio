<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Circle Carousel with Highlight</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #111;
        color: #fff;
        font-family: sans-serif;
      }

      .carousel {
        position: relative;
        width: 400px;
        height: 400px;
      }

      .center-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 2rem;
        font-weight: bold;
        color: #ff6f61;
        pointer-events: none;
      }

      .item {
        position: absolute;
        width: 80px;
        height: 80px;
        background: #ff6f61;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: bold;
        transition: all 0.3s ease;
        opacity: 0.4;
      }

      .item.active {
        transform: scale(1.3) !important;
        opacity: 1;
        z-index: 10;
        background: #ffd166;
        color: #111;
      }
    </style>
  </head>
  <body>
    <div class="carousel" id="carousel">
      <div class="center-text">SKILLS</div>
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
    </div>

    <script>
      const carousel = document.getElementById("carousel");
      const items = carousel.querySelectorAll(".item");

      const radius = 150; // circle radius
      let angle = 0; // rotation angle

      function positionItems() {
        const step = (2 * Math.PI) / items.length;
        let highestY = -Infinity;
        let topItem = null;

        items.forEach((item, index) => {
          const x = radius * Math.cos(angle + step * index);
          const y = radius * Math.sin(angle + step * index);

          item.style.transform = `translate(${x + 160}px, ${y + 160}px)`;

          // Track the item with the highest Y (visually "top")
          if (y < highestY || highestY === -Infinity) {
            highestY = y;
            topItem = item;
          }
        });

        // Reset all, then highlight top item
        items.forEach((i) => i.classList.remove("active"));
        if (topItem) topItem.classList.add("active");
      }

      function rotateCarousel() {
        angle += 0.01; // speed
        positionItems();
        requestAnimationFrame(rotateCarousel);
      }

      positionItems();
      rotateCarousel();
    </script>
  </body>
</html>
