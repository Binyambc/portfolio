<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery - Binyam Angamo</title>
    <meta name="description" content="Gallery - Binyam Angamo portfolio" />
    <link rel="icon" href="images/logo.webp" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" /></noscript>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  </head>
  <body>
    <header>
      <div class="header-container">
        <div class="logo">
          <a href="index.html">
            <img src="images/logo.webp" alt="Logo" width="23" height="20" decoding="async" />
          </a>
        </div>
        <nav>
          <div class="nav-links" id="navLinks">
            <button class="close-menu" id="closeMenu" aria-label="Close menu">
              <i class="fa fa-times"></i>
            </button>
            <a href="index.html#home">Home</a>
            <a href="index.html#about">About</a>
            <a href="index.html#projects">Projects</a>
            <a href="index.html#skills">Skills</a>
            <a href="gallery.html">Gallery</a>
            <a href="index.html#contact">Contact</a>
            <button id="darkModeToggle" aria-label="Toggle dark mode">
              <i id="darkModeIcon" class="fa-solid fa-moon"></i>
            </button>
          </div>
          <div class="button-group">
            <button class="hamburger" aria-label="Navigation menu">
              <i class="fa fa-bars"></i>
            </button>
          </div>
        </nav>
      </div>
    </header>
    <div class="header-spacer" aria-hidden="true"></div>
    <section id="gallery">
      <h2>Gallery</h2>
      <div class="gallery-grid">
        <img src="images/gridLion.webp" alt="Grid lion" loading="lazy" decoding="async" />
        <img src="images/emblem_lion.webp" alt="Emblem Lion" loading="lazy" decoding="async" />
        <img src="images/zelephant.webp" alt="Zelephant" loading="lazy" decoding="async" />
        <img src="images/bunna.webp" alt="Bunna" loading="lazy" decoding="async" />
        <img src="images/stand_out.webp" alt="Stand out" loading="lazy" decoding="async" />
        <img src="images/genna.webp" alt="Genna" loading="lazy" decoding="async" />
        <img src="images/hotel.webp" alt="Hotel" loading="lazy" decoding="async" />
        <img src="images/residence_3d.webp" alt="Residence 3D" loading="lazy" decoding="async" />
        <img src="images/residence_ground_floor.webp" alt="Residence ground floor" loading="lazy" decoding="async" />
        <img src="images/residence_first_floor.webp" alt="Residence first floor" loading="lazy" decoding="async" />
        <img src="images/residence_site_plan.webp" alt="Residence site plan" loading="lazy" decoding="async" />
        <img src="images/moose_tenderloin.webp" alt="Moose tenderloin" loading="lazy" decoding="async" />
        <img src="images/chicken_breast_carrot.webp" alt="Chicken breast carrot puree base" loading="lazy" decoding="async" />
        <img src="images/chicken_breast_parsley.webp" alt="Chicken breast parsley and spinach base" loading="lazy" decoding="async" />
      </div>
    </section>

    <div id="galleryLightbox" class="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="View image">
      <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close">
        <i class="fa fa-times"></i>
      </button>
      <button type="button" class="lightbox-prev" id="lightboxPrev" aria-label="Previous image">
        <i class="fa fa-chevron-left"></i>
      </button>
      <button type="button" class="lightbox-next" id="lightboxNext" aria-label="Next image">
        <i class="fa fa-chevron-right"></i>
      </button>
      <div class="lightbox-content">
        <img id="lightboxImage" src="" alt="" />
      </div>
    </div>

    <script src="main.js" defer></script>
  </body>
</html>
